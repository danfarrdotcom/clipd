name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: xcodebuild -project Clipd.xcodeproj -scheme Clipd -configuration Release -derivedDataPath build/ CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO
