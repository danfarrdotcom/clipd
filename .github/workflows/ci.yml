name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.app
      - name: Build
        run: xcodebuild -project Clipd.xcodeproj -scheme Clipd -configuration Release -derivedDataPath build/ CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO
